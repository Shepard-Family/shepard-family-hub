<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#15345b" />
  <title>Shepard Family Hub</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#eef4fb,#fff)}
    .auth-card{width:min(520px,100%);background:#fff;border:1px solid #dfe7f1;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(20,52,91,.12)}
    .auth-card h1{margin:.3rem 0}.auth-tabs{display:flex;gap:8px;margin:20px 0}.auth-tabs button{flex:1}
    .hidden{display:none!important}.status-dot{width:9px;height:9px;border-radius:50%;background:#35a36b;display:inline-block;margin-right:6px}
    .setup-banner{background:#fff7dc;border:1px solid #eed381;border-radius:14px;padding:12px 14px;margin-bottom:16px}
    .danger{background:#9e2f2f!important}.muted{color:var(--muted)}
  </style>
</head>
<body>
  <section id="authScreen" class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="pointer-events:none"><span class="brand-mark">SF</span><span><strong>Shepard Family Hub</strong><small>Private family community</small></span></div>
      <h1 id="authTitle">Sign in</h1>
      <p class="muted">Family birthdays, events, RSVPs, and alerts in one private place.</p>
      <div class="auth-tabs">
        <button id="signInTab" class="btn" onclick="setAuthMode('signin')">Sign in</button>
        <button id="signUpTab" class="btn secondary" onclick="setAuthMode('signup')">Create account</button>
      </div>
      <form id="authForm" class="form-grid">
        <div id="nameFields" class="field full hidden">
          <div class="form-grid">
            <div class="field"><label>First name</label><input id="authFirst" autocomplete="given-name"></div>
            <div class="field"><label>Last name</label><input id="authLast" autocomplete="family-name"></div>
          </div>
        </div>
        <div id="accessCodeField" class="field full hidden"><label>Family Access Code</label><input id="authAccessCode" autocomplete="off" autocapitalize="characters" placeholder="SHEPARD-XXXX-XXXX-XXXX"><span class="hint">Ask a family administrator for the current code.</span></div>
        <div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
        <div class="field full"><label>Password</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></div>
        <div class="field full"><button id="authSubmit" class="btn" type="submit">Sign in</button></div>
      </form>
      <p id="authMessage" class="hint"></p>
    </div>
  </section>

  <div id="mainShell" class="app-shell hidden">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Go home"><span class="brand-mark">SF</span><span><strong>Shepard Family Hub</strong><small><span class="status-dot"></span>Shared family database</small></span></button>
      <div class="top-actions"><button class="icon-btn" onclick="refreshAll()" title="Refresh">↻</button><button class="avatar" data-go="profile" id="avatarBtn">--</button></div>
    </header>
    <main id="app" class="content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-go="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-go="birthdays" class="nav-item"><span>🎂</span><small>Birthdays</small></button>
      <button data-go="events" class="nav-item"><span>📅</span><small>Events</small></button>
      <button data-go="family" class="nav-item"><span>👨‍👩‍👧‍👦</span><small>Family</small></button>
      <button data-go="profile" class="nav-item"><span>👤</span><small>Profile</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
